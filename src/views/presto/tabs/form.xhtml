<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
		xmlns:h="http://java.sun.com/jsf/html"
		xmlns:p="http://primefaces.org/ui" 
		xmlns:ui="http://java.sun.com/jsf/facelets"
		xmlns:f="http://java.sun.com/jsf/core"
		xmlns:c="http://java.sun.com/jsp/jstl/core">

	<h2 class="underline form-refresh" data-refresh="text-render">@getTitulo; @codigo;</h2>
	<ui:include src="../partidas/pDec.xhtml"></ui:include>
	<ui:include src="../partidas/pInc.xhtml"></ui:include>
	<ui:include src="../parts/form_info.xhtml"></ui:include>

	<div class="navbar">
		<a href="#tab-back" is="nav-link" class="btn btn-primary" title="#{msg['tit.btn.volver.ini']}">
			<i class="fas fa-caret-left"></i>#{msg['lbl.btn.volver']}</a>
		<button type="submit" is="btn-save" class="btn btn-green" title="Poner solicitud a la firma">
			#{msg['lbl.btn.enviar']}<i class="fas fa-caret-right"></i></button>

		<button type="button" is="btn-firmar" name="firmar" class="btn btn-green" title="#{msg['tit.btn.firmar']}">
			<i class="far fa-file-signature"></i>#{msg['lbl.btn.firmar']}</button>
		<button type="button" is="btn-rechazar" name="rechazar" class="btn btn-error" title="#{msg['tit.btn.rechazar']}">
			<i class="fas fa-times-circle"></i>#{msg['lbl.btn.rechazar']}</button>
		<button type="button" is="btn-cancelar" name="cancelar" class="btn btn-error" title="#{msg['tit.btn.cancelar']}">
			<i class="fas fa-times-circle"></i>#{msg['lbl.btn.cancelar']}</button>

		<button type="submit" is="btn-subsanar" name="subsanar" class="btn btn-green" title="Guarda los cambios realizados">
			<i class="far fa-save"></i>Subsanar</button>
		<button type="button" is="btn-report" name="report" class="btn btn-danger" title="Informe PRESTO">
			<i class="fal fa-file-pdf"></i>Informe</button>
		<button type="button" is="btn-remove" name="remove" class="btn btn-danger" title="Borra la solicitud del sistema"> 
			<i class="fal fa-trash-alt"></i>Eliminar</button>
	</div>
	<ui:include src="../parts/firmas.xhtml"></ui:include>
</html>
