<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
		xmlns:h="http://java.sun.com/jsf/html"
		xmlns:p="http://primefaces.org/ui" 
		xmlns:ui="http://java.sun.com/jsf/facelets"
		xmlns:f="http://java.sun.com/jsf/core"
		xmlns:c="http://java.sun.com/jsp/jstl/core">

	<label class="ui-block-xl">
		<div class="label required">Tipos de Ingreso:</div>
		<select name="subtipo" is="subtipo-list" tabindex="4">
			<option value="14" class="facturable">MATRÍCULAS ENSEÑANZA OFICIAL - CONVENIOS EDUCATIVOS (SUBV. PRECIO)</option> 
			<option value="4"  class="facturable">MATRÍCULA ENSEÑANZA OFICIAL</option>
			<option value="3"  class="facturable">TÍTULOS PROPIOS (INCLUYE IDIOMAS, EXTRANJEROS, CAP, …)</option>
			<option value="15" class="facturable">TÍTULOS PROPIOS CON CANON</option>
			<option value="25" class="facturable">TÍTULOS PROPIOS EMPRESAS</option>
			<option value="9"  class="facturable">CURSOS DE EXTENSIÓN (VERANO, MAYORES, OTROS)</option>
			<option value="16" class="facturable">PATROCINIOS DE TÍTULOS PROPIOS</option>
			<option value="17" class="facturable">PATROCINIOS DE CURSOS DE VERANO</option>
			<option value="18" class="facturable">PATROCINIOS DE OTRAS ACTIVIDADES DE EXTENSIÓN</option>
			<option value="26" class="facturable">PATROCINIOS DE RETOS UPCT</option>
			<option value="5"  class="facturable">SAIT PRESTACIONES DE SERVICIOS</option>
			<option value="19" class="facturable">SAIT ENTREGAS DE IMPRESIONES 3D, PIEZAS, PROTOTIPOS Y OTROS BIENES</option>
			<option value="1"  class="facturable" disabled>CONTRATO DE I+D+I</option>
			<option value="20" class="facturable">PRESTACIONES DE SERVICIOS DEL CPCD</option>
			<option value="21" class="facturable">PRESTAMO INTERBIBLIOTECARIO</option>
			<option value="22" class="facturable">VENTA DE LIBROS EN PAPEL</option>
			<option value="23" class="facturable">VENTA DE LIBROS ELECTRÓNICOS</option>
			<option value="6"  class="facturable">ALQUILER DE ESPACIOS</option>
			<option value="2"  class="facturable" disabled>LICENCIAS SOBRE PATENTES</option>
			<option value="11" class="facturable">OTROS (CANARIAS/CEUTA/MELILLA, MOOCs, DEPORTES, SYMPOSIUM, CENTROS ADSCRITOS, FOTOCOPIAS, CONCESIONES, ENAJENACIÓN DE BIENES)</option>
			<option value="24" class="facturable">ASISTENCIA A CONGRESOS</option>
			<option value="12" class="carta-pago" disabled>RED DE CÁTEDRAS</option>
			<option value="27" class="carta-pago">DONACIÓN LEY DE MECENAZGO</option>
			<option value="13" class="carta-pago">OTROS</option>
		</select>
	</label>
	<label class="autocomplete ui-block-md">
		<div class="label required">Recibo asociado a la factura:</div>
		<input type="search" name="recibo" is="recibo-input" tabindex="4" />
		<ul role="list" class="results"></ul>
	</label>
</html>
