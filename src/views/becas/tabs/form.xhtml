<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
		xmlns:h="http://java.sun.com/jsf/html"
		xmlns:p="http://primefaces.org/ui" 
		xmlns:ui="http://java.sun.com/jsf/facelets"
		xmlns:f="http://java.sun.com/jsf/core"
		xmlns:c="http://java.sun.com/jsp/jstl/core">

	<div class="card-xeco">
		<h2 is="titulo-h2" class="underline"></h2>
		<div class="ui-blocks">
			<label class="ui-block">
				<div class="label required">Tipo de Ayuda:</div>
				<select name="tipo" is="data-list">
					<option value="1">Becas Erasmus</option>
					<option value="2">Otras becas y ayudas</option>
					<option value="3">Premios</option>
				</select>
			</label>
			<label class="ui-block-xl autocomplete">
				<div class="label required">Cual es la orgánica para la factura:</div>
				<i class="fas fa-search ui-input-icon left"></i>
				<input type="search" name="organica" is="organica-input" class=" ui-beca" placeholder="Introduce una orgánica" />
				<ul role="list" class="results"></ul>
			</label>
			<label class="ui-block-row">
				<div class="label required">Denominación de la convocatoria o ayuda:</div>
				<textarea name="memo" is="text-area" class="ui-beca" required="1"></textarea>
			</label>
		</div>

		<hr/> <!-- Adjuntos -->
		<div class="ui-blocks">
			<div class="ui-block-row">
				<button type="button" is="btn-bases" class="btn btn-primary ui-beca"></button>
				<input type="file" name="bases" is="file-input" accept="application/pdf" class="hide" /><span></span>
			</div>
			<div class="ui-block-row">
				<button type="button" is="btn-resolucion" class="btn btn-primary ui-beca"></button>
				<input type="file" name="resolucion" is="file-input" accept="application/pdf" class="hide" /><span></span>
			</div>
			<div class="ui-block-row">
				<button type="button" name="btnBeneficiarios" is="btn-beneficiarios" class="btn btn-primary ui-beca"></button>
				<a href="#" class="btn btn-error hide"><i class="fas fa-times"></i></a>
				<input type="file" name="beneficiarios" is="file-input" accept=".xls, .xlsx" class="hide" /><span></span>
			</div>
		</div>

		<hr/>
		<div class="ui-blocks">
			<label class="ui-block">
				<div class="label required">Fecha de la resolución de concesión:</div>
				<input type="date" name="fResolucion" is="date-input" class="ui-input"/>
			</label>
			<label class="ui-block">
				<div class="label">Fecha máxima de pago:</div>
				<input type="date" name="fPago" is="date-input" class="ui-input"/>
			</label>
			<label class="ui-block">
				<div class="label required">Importe total concedido:</div>
				<input type="text" name="total" is="float-input" required="gt0"/> €
			</label>
			<label class="ui-block-row">
				<div class="label">Observaciones:</div>
				<textarea name="desc" is="text-area"></textarea>
			</label>
		</div>
	</div>

	<div class="card-xeco">
		<h2>Detalle de beneficiarios</h2>
		<div class="ui-blocks">
			<label class="ui-block-xl autocomplete">
				<div class="label required">Beneficiario (CIF / NIF / Nombre):</div>
				<i class="fas fa-search ui-input-icon left"></i>
				<input type="search" name="tercero" is="ac-tercero" placeholder="Indique un tercero" />
				<ul role="list" class="results"></ul>
			</label>
			<div class="ui-block-btn">
				<button type="button" is="add-tercero" class="btn btn-green"><i class="fas fa-plus"></i>Añadir</button>
				<a href="#tab-tercero" is="nav-link" class="btn btn-warn" title="Alta de un nuevo tercero">
					<i class="fas fa-plus-octagon"></i>Nuevo Tercero</a>
			</div>
		</div>

		<table id="terceros" is="terceros-table" class="tb-xeco">
			<thead>
				<tr>
					<th>Nº</th><th>NIF</th><th>Estado</th><th>Nombre</th>
					<th>País de Residencia</th><th>Domicilio</th><th>Municipio</th><th>CP</th>
					<th>Entidad</th><th>IBAN</th><th>Nuevo</th><th>Swift</th>
					<th class="currency">Importe</th><th>Acciones</th>
				</tr>
			</thead>
			<tbody></tbody>
			<tfoot>
				<tr>
					<td colspan="12" class="table-reload" data-reload="text-render">Beneficiarios: @size;</td>
					<td class="currency table-reload" data-reload="text-render">$importe; €</td><td></td>
				</tr>
			</tfoot>
		</table>
	</div>

	<!-- Botones -->
	<div class="navbar">
		<a href="#tab-back" is="nav-link" class="btn btn-primary" title="#{msg['tit.btn.volver.ini']}">
			<i class="fas fa-caret-left"></i>#{msg['lbl.btn.volver']}</a>
		<button type="submit" is="btn-save" class="btn btn-green" title="Poner solicitud a la firma">
			#{msg['lbl.btn.enviar']}<i class="fas fa-caret-right"></i></button>

		<button type="button" is="btn-firmar" class="btn btn-green" title="#{msg['tit.btn.firmar']}">
			<i class="far fa-file-signature"></i>#{msg['lbl.btn.firmar']}</button>
		<button type="button" is="btn-rechazar" class="btn btn-error" title="#{msg['tit.btn.rechazar']}">
			<i class="fas fa-times-circle"></i>#{msg['lbl.btn.rechazar']}</button>
		<button type="button" is="btn-cancelar" class="btn btn-error" title="#{msg['tit.btn.cancelar']}">
			<i class="fas fa-times-circle"></i>#{msg['lbl.btn.cancelar']}</button>

		<button type="button" is="btn-report" class="btn btn-danger" title="Informe de la solicitud">
			<i class="fal fa-file-pdf"></i>Informe</button>

		<button type="button" is="btn-remove" class="btn btn-danger" title="Borra la solicitud del sistema"> 
			<i class="fal fa-trash-alt"></i>Eliminar</button>
	</div>
	<ui:include src="../parts/firmas.xhtml"></ui:include>
</html>
