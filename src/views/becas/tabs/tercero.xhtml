<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
		xmlns:h="http://java.sun.com/jsf/html"
		xmlns:p="http://primefaces.org/ui" 
		xmlns:ui="http://java.sun.com/jsf/facelets"
		xmlns:f="http://java.sun.com/jsf/core"
		xmlns:c="http://java.sun.com/jsp/jstl/core">

	<div class="card-xeco">
		<h2>Nuevo beneficiario</h2>
		<div class="ui-blocks">
			<label class="ui-block">
				<div class="label required">NIF:</div>
				<input type="text" name="nif" is="nif-input" required="1" class="ui-tercero ui-code" maxlength="50" />
				<div class="ui-errtip"></div>
			</label>
			<label class="ui-block">
				<div class="label required">Tipo de documento:</div>
				<select name="doc" is="data-list" disabled="1" class="editable-manual ui-disabled ui-tercero">
					<option value="1">NIF - Número de Identificación Fiscal</option>
					<option value="2">NIE - Número de Identificación de Extranje</option>
					<option value="3">TRC - Tarjeta de Régimen Comunitario</option>
					<option value="4">PRT - Permiso de Residencia y Trabajo</option>
					<option value="5">PAS - Pasaporte</option>
					<option value="7">NOI - Documento de Identidad</option>
					<option value="8">NCE - Número de Cédula</option>
					<option value="9">DID - No Informado</option>
					<option value="10">ASG - Asignado</option>
					<option value="11">OTR - Otros tipos</option>
				</select>
			</label>
			<label class="ui-block">
				<div class="label required">Estado:</div>
				<select name="estado" is="data-list" disabled="1" class="editable-manual ui-disabled ui-tercero">
					<option value="2">Nuevo</option>
					<option value="1">Cancelado</option>
					<option value="0">Activo</option>
				</select>
			</label>
		</div>
		<div class="ui-blocks">
			<label class="ui-block-lg">
				<div class="label required">Nombre:</div>
				<input type="text" name="nombre" is="text-input" required="1" class="ui-tercero" maxlength="90" />
				<div class="ui-errtip"></div>
			</label>
			<label class="ui-block-lg">
				<div class="label required">Primer Apellido:</div>
				<input type="text" name="ap1" is="text-input" required="1" class="ui-tercero" maxlength="90" />
				<div class="ui-errtip"></div>
			</label>
			<label class="ui-block-lg">
				<div class="label">Segundo Apellido:</div>
				<input type="text" name="ap2" is="text-input" class="ui-tercero" maxlength="90" />
				<div class="ui-errtip"></div>
			</label>
		</div>
		<br/>

		<h2>Dirección de contacto</h2>
		<div class="ui-blocks">
			<label class="ui-block">
				<div class="label required">Residencia:</div>
				<select name="residencia" is="data-list" required="1" class="ui-tercero"></select>
			</label>
			<label class="ui-block-lg">
				<div class="label required">Domicilio:</div>
				<input type="text" name="dir" is="text-input" required="1" class="ui-tercero" maxlength="200" />
				<div class="ui-errtip"></div>
			</label>
			<label class="ui-block-lg">
				<div class="label required">Municipio:</div>
				<input type="text" name="mun" is="text-input" required="1" class="ui-tercero" maxlength="90" />
				<div class="ui-errtip"></div>
			</label>
			<label class="ui-block">
				<div class="label required">Código Postal:</div>
				<input type="text" name="cp" is="text-input" required="1" class="ui-tercero" maxlength="20" />
				<div class="ui-errtip"></div>
			</label>
		</div>
		<br/>

		<h2>Datos bancarios</h2>
		<div class="ui-blocks">
			<label class="ui-block">
				<div class="label required"><h:outputText value="#{msg['lbl.pais']}" escape="false" />:</div>
				<select name="paisEntidad" is="paises-list" required="1" class="ui-tercero"></select>
			</label>
			<label class="ui-block-lg">
				<div class="label required"><h:outputText value="#{msg['lbl.entidad']}" escape="false" />:</div>
				<input type="text" name="banco" is="text-input" maxlength="50" class="ui-tercero" />
				<div class="ui-errtip"></div>
			</label>
			<label class="ui-block">
				<div class="label required"><h:outputText value="#{msg['lbl.entidad']}" escape="false" />:</div>
				<select name="entidad" is="data-list" class="ui-tercero">
					<c:forEach items="#{becas.tercero.entidades}" var="banco">
						<option value="#{banco.value}">#{banco.label}</option>
					</c:forEach>
				</select>
				<div class="ui-errtip"></div>
			</label>
			<label class="ui-block-lg">
				<div class="label required"><h:outputText value="#{msg['lbl.num.cuenta']}" escape="false" />:</div>
				<input type="text" name="iban" is="text-input" required="1" maxlength="50" class="ui-tercero" />
				<div class="ui-errtip"></div>
			</label>
			<label class="ui-block hide">
				<div class="label">Swift:</div>
				<input type="text" name="swift" is="text-input" maxlength="30" class="ui-code ui-tercero" />
				<div class="ui-errtip"></div>
			</label>
			<label class="ui-block">
				<div class="label required">Importe concedido:</div>
				<input type="text" name="impNuevo" is="float-input" required="gt0" class="ui-tercero"/> €
				<div class="ui-errtip"></div>
			</label>
		</div>
	</div>

	<!-- Botones -->
	<div class="navbar">
		<a href="#tab-back" class="btn btn-info" title="#{msg['tit.btn.volver.ini']}">
			<i class="fas fa-caret-left"></i>#{msg['lbl.btn.volver']}</a>
		<button type="button" is="create-tercero" class="btn btn-green" title="Añadir nuevo tercero a la solicitud">
			Añadir tercero<i class="fas fa-plus"></i></button>
	</div>
</html>
