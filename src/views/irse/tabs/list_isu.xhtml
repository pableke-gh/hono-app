<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
		xmlns:h="http://java.sun.com/jsf/html"
		xmlns:p="http://primefaces.org/ui" 
		xmlns:ui="http://java.sun.com/jsf/facelets"
		xmlns:f="http://java.sun.com/jsf/core"
		xmlns:c="http://java.sun.com/jsp/jstl/core">

	<h2>Informe ISU</h2>
	<form id="otri" is="xeco-form" action="/uae/iris/isu">
		<div class="ui-blocks">
			<label class="ui-block-xl autocomplete">
				<div class="label required">Orgánica:</div>
				<i class="fas fa-search ui-input-icon left"></i>
				<input type="search" name="organica" is="organica-isu" title="#{msg['uae.irse.index.msg.cd']}" placeholder="Selecciona una orgánica" />
				<ul role="list" class="results"></ul>
			</label>
			<label class="ui-block multiselect">
				<div class="label required">Ejercicios:</div>
				<button type="button" name="ejercicios" is="ej-list"></button>
				<ul role="list" class="results"></ul>
			</label>
		</div>

		<div class="navbar">
			<a href="#tab-init" is="nav-link" class="btn btn-primary" title="#{msg['tit.btn.volver.ini']}">
				<i class="fas fa-caret-left"></i><h:outputText value="#{msg['lbl.btn.volver']}" escape="false" /></a>
			<button type="submit" is="btn-form" class="btn btn-primary" tabindex="13"><i class="far fa-search"></i>Buscar</button>
		</div>

		<br class="clear"/>
		<table id="tOtri" is="otri-table" class="tb-xeco">
			<thead>
				<tr>
					<th>Ej.</th>
					<th>ID</th>
					<th>Nº JG</th>
					<th>Nº Factura</th>
					<th>NIF</th>
					<th>Tercero</th>
					<th>Total JG</th>
					<th>F. Emisión</th>
					<th class="hide-sm">Descripción</th>
					<th></th>
				</tr>
			</thead>
			<tbody></tbody>
			<tfoot>
				<tr><td colspan="99" class="table-reload" data-reload="text-render"><h:outputText value="#{msg['lbl.filas']}" escape="false" />: @size;</td></tr>
			</tfoot>
		</table>

		<div class="navbar">
			<a href="#tab-init" is="nav-link" class="btn btn-primary" title="#{msg['tit.btn.volver.ini']}">
				<i class="fas fa-caret-left"></i><h:outputText value="#{msg['lbl.btn.volver']}" escape="false" /></a>
			<button type="button" name="excel" is="btn-excel" class="btn btn-green hide" title="Exportar datos a formato EXCEL"><i class="fa fa-file-excel"></i>Exportar a Excel</button>
		</div>
	</form>
</html>
