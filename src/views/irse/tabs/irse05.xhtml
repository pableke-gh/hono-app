<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
		xmlns:h="http://java.sun.com/jsf/html"
		xmlns:p="http://primefaces.org/ui" 
		xmlns:ui="http://java.sun.com/jsf/facelets"
		xmlns:f="http://java.sun.com/jsf/core"
		xmlns:c="http://java.sun.com/jsp/jstl/core">

	<h2 is="titulo-h2" class="underline"></h2>
	<div class="card-xeco">
		<h2>
			<img src="/uae/resources/images/speaker.png" width="30px"/>
			<span class="text-warn form-refresh" data-refresh="text-render" data-event="perfil">@getPaso;</span>
			<span><h:outputText value="#{msg['uae.irse.tab5.msg.tit']}" escape="false" /></span>
		</h2>

		<ui:include src="./irse05_info.xhtml"></ui:include>
		<div is="grupo-gasto" class="ui-blocks">
			<div class="ui-block-btn">
				<a href="next" is="run-action" class="btn btn-green" tabindex="100"><i class="fas fa-share"></i>¡Por Aquí!</a>
				<input type="file" name="fileGasto" is="file-input" class="ui-gasto hide" data-filename=".fg-name" />
			</div>
			<label class="ui-block hide">
				<div class="label required"><h:outputText value="#{msg['lbl.tipo.fac.doc']}" escape="false" />:</div>
				<select name="tipoGasto" is="tipo-gasto" class="ui-gasto" tabindex="100"></select>
			</label>
			<label class="ui-block hide">
				<div class="label required"><h:outputText value="#{msg['lbl.importe']}" escape="false" />:</div>
				<input type="text" id="impGasto" name="impGasto" is="float-input" tabindex="101" class="ui-gasto" title="Importe de la factura que corresponde a la comisión" /><span class="icon">€</span>
			</label>
			<label class="ui-block-lg hide">
				<div class="label required"><h:outputText value="#{msg['lbl.desc.obsev']}" escape="false" />:</div>
				<input type="text" id="txtGasto" name="txtGasto" is="text-input" maxlength="300" tabindex="102" class="ui-text ui-gasto"/>
			</label>
			<label class="ui-block hide">
				<div class="label required"><h:outputText value="#{msg['lbl.check.in.out']}" escape="false" />:</div>
				<input type="date" id="fAloMin" name="fAloMin" is="date-input" tabindex="102" class="ui-gasto" title="Límite inferior del rango de fechas"/> ...
				<input type="date" id="fAloMax" name="fAloMax" is="date-input" tabindex="103" class="ui-gasto" title="Límite superior del rango de fechas"/>
			</label>
			<div class="ui-block-btn hide">
				<button type="button" is="upload-gasto" name="upload" class="btn btn-green">Añadir<i class="fas fa-arrow-alt-down"></i></button>
			</div>
		</div>
		<div class="text-height fg-name"></div>

		<table id="gastos" is="gastos-table" class="tb-xeco table-xs">
			<thead>
				<tr>
					<th>Nº</th>
					<th><h:outputText value="#{msg['lbl.tipo.gasto']}" escape="false" /></th>
					<th><h:outputText value="#{msg['lbl.desc.obsev']}" escape="false" /></th>
					<th><h:outputText value="#{msg['lbl.adjunto']}" escape="false" /></th>
					<th><h:outputText value="#{msg['lbl.importe']}" escape="false" /></th>
					<th class="no-print"></th>
				</tr>
			</thead>
			<tbody></tbody>
			<tfoot>
				<tr><td colspan="99" class="table-reload" data-reload="text-render">Documentos: @size;</td></tr>
			</tfoot>
		</table>

		<p is="msg-gastos">
			<span class="text-block">*</span>
			<h:outputText value="#{msg['msg.etapas.no.asociadas']}" escape="false" />: @getNumRutasPendientes;;
			<h:outputText value="#{msg['msg.noches.no.asociadas']}" escape="false" />: @getNochesPendientes;; (<h:outputText value="#{msg['msg.info.etapas']}" escape="false" />)
		</p>
	</div>

	<!-- Botones -->
	<div class="navbar">
		<a href="#tab-prev" is="nav-link" class="btn btn-primary" title="#{msg['tit.btn.volver']}">
			<i class="fas fa-caret-left"></i><h:outputText value="#{msg['lbl.btn.volver']}" escape="false" /></a>
		<a href="#tab-next" is="nav-link" class="btn btn-primary" title="#{msg['tit.btn.siguiente']}">
			<h:outputText value="#{msg['lbl.btn.siguiente']}" escape="false" /><i class="fas fa-caret-right"></i></a>
		<button type="button" is="save-gasto" class="btn btn-green" title="#{msg['tit.btn.no.enviar']}">
			<i class="far fa-save"></i><h:outputText value="#{msg['lbl.btn.no.enviar']}" escape="false" /></button>
		<ui:include src="../parts/btn_firmar.xhtml"></ui:include>
	</div>
</html>
