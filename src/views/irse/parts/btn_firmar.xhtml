<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
		xmlns:h="http://java.sun.com/jsf/html"
		xmlns:p="http://primefaces.org/ui" 
		xmlns:ui="http://java.sun.com/jsf/facelets"
		xmlns:f="http://java.sun.com/jsf/core"
		xmlns:c="http://java.sun.com/jsp/jstl/core">

	<button type="button" is="btn-firmar" class="btn btn-green" title="#{msg['tit.btn.firmar']}">
		<i class="far fa-file-signature"></i>#{msg['lbl.btn.firmar']}</button>
	<button type="button" is="btn-rechazar" class="btn btn-error" title="#{msg['tit.btn.rechazar']}">
		<i class="fas fa-times-circle"></i>#{msg['lbl.btn.rechazar']}</button>
	<button type="button" is="btn-cancelar" class="btn btn-error" title="#{msg['tit.btn.cancelar']}">
		<i class="fas fa-times-circle"></i>#{msg['lbl.btn.cancelar']}</button>
</html>
